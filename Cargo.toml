[package]
name = "binaural_8d_audio"
version = "1.2.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hrtf = "0.8"
biquad = "0.6"
freeverb = "0.2"
hound = "3.5"
symphonia = { version = "0.6", features = ["all"] }
symphonia-adapter-libopus = "0.3"
rubato = "4.0"
flacenc = "0.5"
mp3lame-encoder = "0.2"
kira = "0.12"
crossterm = { version = "0.28", features = ["events"] }
fastrand = "2.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "make8d"
path = "src/main.rs"
